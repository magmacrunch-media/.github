# The house conventions, checked by CI instead of by a hook.
#
# WHY THIS EXISTS. `no-em-dash.sh --install-all` puts a pre-commit hook in 48 of
# 50 repos and **a hook does not travel with a clone**. So the only mechanical
# control in this tree is enforced on one machine. Measured 2026-10-13: a second
# person now has push on all 45 org repos, their clone has no hooks, and nothing
# in any workflow anywhere checked any convention. The rules were also thin where
# they would actually be read: of the 42 AGENTS.md files, 38 mention AI
# attribution, 25 commit identity, 13 line endings, 5 the shared tree, and
# **2 em dashes**.
#
# HOW TO USE IT. This is a reusable workflow. Put it in a repo every consumer can
# read, then call it in three lines from each repo:
#
#     name: conventions
#     on: [push, pull_request]
#     jobs:
#       conventions:
#         uses: magmacrunch-media/.github/.github/workflows/conventions-check.yml@main
#
# `.github` is PUBLIC, which is what makes it callable from every private repo
# without a token: a public repo's reusable workflows are available org wide. A
# private host would need per-repo access granted, which is 42 settings pages.
# Nothing secret goes in here, and nothing should.
#
# WHAT IT DOES NOT DO. It does not reformat, rewrite or push. It reads the diff
# and the commit messages. Every fix is the author's.
#
# THREE CHECKS FAIL AND ONE WARNS, and that split is the design rather than a
# compromise. AI attribution, CRLF in the index and a missing AGENTS.md are
# mechanical: there is a right answer and a machine can hold it. Em dash density
# is a judgement about writing, so that one counts and warns. A gate there would
# block generated content nobody typed, and it would teach people to route
# around the check, which is worse than having no check.
#
# THE DISCIPLINE IT INHERITS, from git-status.ps1, count-status.ps1 and
# docs-status.ps1: it prints how much it examined on EVERY run and fails when
# that comes back impossible, so **a broken scan cannot read as a clean pass.**
# A checker whose range resolution silently breaks and then reports success is
# the exact fault this tree keeps recording: the identity sweep that passes by
# finding nothing, refresh.ps1 printing a match over a comparison it had not
# made, crunch-c's dispatch 401ing for three weeks with nobody reading it.

name: conventions

on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          A JSON ARRAY of runner labels, as a string. Private repos pass
          '["self-hosted","MC1","Linux"]' so their minutes are free; public
          repos leave it alone, because the Default runner group has
          allows_public_repositories = false and a public repo pointed at an
          org runner QUEUES FOREVER rather than failing.
          It is JSON rather than a bare label because a single label cannot
          name MC1's Linux runner: `MC1` is carried by MC1-linux-org AND
          MC1-win-org, so the OS has to be named too.
        type: string
        default: '["ubuntu-latest"]'
      skip-em-dash:
        description: Set true only for a repo whose own pre-commit already does it.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conventions:
    # fromJSON, because the input is a JSON array string. A bare label
    # cannot name MC1's Linux runner: `MC1` matches MC1-win-org too.
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the range below needs both endpoints to
          # exist locally. A shallow clone makes merge-base fail, and a failing
          # merge-base is how this check would silently examine nothing.
          fetch-depth: 0

      - name: Work out what is new in this push or pull request
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # A new branch, a force push, or the first push to a repo gives a base
          # of all zeroes or one that is simply not here. Fall back to the first
          # parent, which examines the tip commit rather than nothing.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base unusable, falling back to ${head}^" >&2
            base="$(git rev-parse "${head}^" 2>/dev/null || echo "$head")"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Range: $base..$head"

      - name: Count em dashes on added lines
        if: ${{ !inputs.skip-em-dash }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.range.outputs.base }}'
          head='${{ steps.range.outputs.head }}'

          # ADDED lines only, which is the whole design and not a shortcut. The
          # back catalogue holds 8,848 em dashes across 651 markdown files; a
          # sweep would rewrite all of them to fix nothing anybody reads, and
          # would do it straight into the CRLF traps in CLAUDE.md.
          # BRACKETED, in BOTH greps, and that is the whole point of this line.
          # The first version used `grep -E '^\+' | grep -v '^\+\+\+'`, and the
          # second grep has no -E, so it is a BASIC regex, where GNU grep reads
          # backslash-plus as the one-or-more QUANTIFIER rather than a literal
          # plus. It therefore matched effectively every line and -v threw them
          # all away. The step reported "Examined 0 added line(s)" on a commit
          # that added 215 and PASSED. A character class means the same thing in
          # both dialects, so there is nothing left to get wrong.
          added="$(git diff --unified=0 "$base" "$head" -- . \
                   | grep -E '^[+]' | grep -vE '^[+][+][+]' || true)"
          n="$(printf '%s' "$added" | grep -c '' || true)"
          echo "Examined $n added line(s)."

          # AND THE GUARD, which is what should have caught the above and was
          # missing from this step while the commit-message step below had it.
          # It asks git for ITS OWN count of added lines, over the same range
          # and the same pathspec, and fails when the filter found none while
          # git says there were some. Two measurements of one quantity, which
          # is the "a broken scan cannot read as a clean pass" rule: the filter
          # collapsing to nothing cannot read as clean work, because the second
          # count does not collapse with it.
          #
          # IT COUNTED FILE NAMES, AND THAT WAS THE BUG. It read
          # `git diff --name-only | grep -c ''` and failed whenever files
          # changed and no lines were added, on the premise that a commit which
          # changes a file always adds or removes lines. That premise is false
          # four ways: a commit that only DELETES adds nothing, and neither does
          # a pure rename, a mode change, or adding a binary file.
          # magmacrunch-ai 1f55cf2 is what proved it, run 38662832109, failing
          # with "1 file(s) changed but 0 added lines were found" on a commit
          # whose entire content was removing a file. Of the first 807 commits
          # swept in this tree FIVE would have failed here, four deletion-only
          # and one adding nothing but a .woff2. None of the 807 fails the
          # count below.
          #
          # ONE DIRECTION ONLY, which is measured rather than cautious. The two
          # counts legitimately disagree both ways on real commits: a binary
          # file with a textconv shows added lines that numstat scores as `-`,
          # and a 1.2 MB PDF in web\website contributes 508 that way, while
          # added content which itself begins `+++` is eaten by the header
          # filter above. 10 of those 807 commits disagree, so equality would be
          # a gate on a coincidence. Zero against non-zero is the one impossible
          # pair, and it is the exact shape the bug above had.
          reported="$(git diff --numstat "$base" "$head" -- . \
                      | awk '$1 != "-" { s += $1 } END { print s + 0 }')"
          echo "git reports $reported added line(s) over the same range."
          if [ "$n" = 0 ] && [ "$reported" != 0 ]; then
            echo "::error::git reports $reported added line(s) and the filter found 0. The diff filter is broken; this check examined nothing."
            exit 1
          fi

          # BUILT, never spelled. An editor tool renders a backslash-u escape
          # AS the literal dash, which put one into this very file and would
          # have made it fail its own check on the commit that added it. An
          # octal printf dodges both traps, as chr(0x2014) does in the python.
          em="$(printf '\342\200\224')"
          hits="$(printf '%s' "$added" | grep -n "$em" || true)"
          c="$(printf '%s' "$hits" | grep -c '' || true)"

          # A WARNING, DELIBERATELY, not a gate. The house preference is against
          # em dashes used EXCESSIVELY in writing, which is a judgement about
          # density rather than a rule a machine can hold. A hard failure across
          # 42 repos would be the wrong instrument twice over: it would block
          # generated content nobody typed, and this org has plenty of it, with
          # magmacrunch.com's search-index.json alone holding 465 such lines
          # taken from MusicBrainz titles.
          #
          # So it reports the number and lets a person judge. The count is the
          # useful part: one dash in a paragraph is prose, thirty is a habit.
          # no-em-dash.sh on the dev box now does the same thing: it counted and
          # refused until 2026-10-16, which made this the lenient half of a rule
          # whose two halves disagreed. It warns and passes too, so there is no
          # strict version of this anywhere any more, deliberately. What the hook
          # still refuses is a scan that could not run, which is a different
          # fault wearing the same exit code until you read it.
          if [ "$c" != 0 ]; then
            echo "::warning::$c added line(s) contain an em dash. Not a failure. Worth a look if that is a lot for one change."
            printf '%s\n' "$hits" | head -10
          else
            echo "No em dash on any added line."
          fi

      - name: No AI attribution in a commit message
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.range.outputs.base }}'
          head='${{ steps.range.outputs.head }}'

          msgs="$(git log --format='%H%n%B%n--END--' "$base..$head" || true)"
          n="$(git rev-list --count "$base..$head" || echo 0)"
          echo "Examined $n commit message(s)."

          # Zero commits in a range that should have at least one means the
          # range resolution failed, not that the work is clean.
          if [ "$n" = 0 ] && [ "$base" != "$head" ]; then
            echo "::error::the range resolved to no commits; this check examined nothing."
            exit 1
          fi

          if printf '%s' "$msgs" | grep -niE \
             'co-authored-by:[[:space:]]*(claude|chatgpt|copilot|gpt|gemini|cursor)|generated (with|by) (claude|chatgpt|copilot|ai)|🤖' ; then
            echo "::error::AI attribution in a commit message. The house rule is none anywhere: not in commit messages, PR bodies, release notes, comments or docs."
            exit 1
          fi
          echo "No AI attribution found."

      - name: Nothing added with CRLF in the index
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.range.outputs.base }}'
          head='${{ steps.range.outputs.head }}'

          # The index is what matters, not the working tree. A repo may legally
          # pin *.bat, *.sln or *.csproj to CRLF, so ask git what IT thinks each
          # file's committed form is rather than hardcoding a list.
          #
          # ACMRT RATHER THAN ACM, SO A RENAMED FILE IS CHECKED AT ALL. ACM
          # dropped R, and a rename is exactly where a CRLF rewrite could ride
          # in unexamined: git scores the pair as a rename, the filter resolves
          # no file, and the step prints "Examined 0 added or modified file(s)"
          # and passes. That is the silent pass this file exists to refuse, and
          # it was left open for one commit on purpose, because closing it
          # decides to fail pushes that pass today, which is a different kind of
          # decision from removing a false positive.
          #
          # Three shapes reach it, each built in a fixture and each failing now:
          # a pure rename of a file that is ALREADY CRLF, which is the shape
          # every such file in this tree has; a rename with a small edit of one;
          # and a rename that converts an LF file to CRLF wholesale.
          #
          # THE THIRD NEEDS A BIG FILE TO EXIST AT ALL, which is worth knowing
          # before anybody reproduces it. Rename detection is SIMILARITY based,
          # so converting a 3-line file to CRLF scores below the 50% threshold,
          # git breaks the pair into D plus A, and the A was caught by ACM all
          # along. At 400 lines the same conversion scores R094 and was
          # invisible. A fixture case written at the small size reports the hole
          # closed while testing nothing, and the first one written here did
          # exactly that.
          #
          # ACMRT is the exact complement of D between two commits, so this
          # reads as "every path this commit leaves behind", which is the honest
          # set for a question about committed form. U, X and B do not occur in
          # a commit-to-commit diff, so there is no fourth letter waiting to be
          # forgotten.
          files="$(git diff --name-only --diff-filter=ACMRT "$base" "$head" || true)"
          n="$(printf '%s' "$files" | grep -c '' || true)"
          echo "Examined $n added or modified file(s)."

          # SAME GUARD AS THE STEP ABOVE, AND IT HAD THE SAME BUG. It failed
          # when the ACM filter came back empty while the range held commits,
          # on the premise that a range with commits must hold an added or
          # modified file. A commit that only DELETES files holds none, and
          # nor does a pure rename, because ACM excludes both D and R.
          #
          # magmacrunch-ai 1f55cf2 would have failed HERE, and the only reason
          # nobody saw it is that the em dash step failed first and left this
          # one skipped. Proven rather than reasoned: with that step fixed and
          # this one not, running this against 1f55cf2 gives "commits in range
          # but no files resolved" on a commit which removed one file and
          # touched nothing else. So the first fix would have moved the false
          # positive down a step rather than ending it.
          #
          # ASKING WHETHER GIT RESOLVED ANY FILE AT ALL FIXED THE DELETION
          # AND LEFT ONE SHAPE BEHIND: AN EMPTY COMMIT. `git commit
          # --allow-empty` holds no file of any status, so "a range with
          # commits that resolves no file is a broken range" fails it while
          # the range is perfectly good. That is the same false premise one
          # notch narrower, and it is worth saying plainly: the first version
          # asked whether FILES CHANGED, the second whether ANY FILE RESOLVED,
          # and both asked the diff to prove the scan ran when an empty diff
          # is a legitimate answer to a legitimate commit.
          #
          # Six empty commits are in this tree, in web\website (2),
          # very-long-boards (2), george-boole and crystal-mirror-maze, and
          # they are deliberate rather than stray: web\website 6b5d5e45 is
          # Pi Bot's "test: verify deploy key push". Proven rather than
          # reasoned, by running this step against that commit, which gives
          # "commits in range but no files resolved" on a commit whose entire
          # purpose was to carry nothing.
          #
          # So ask what the em dash step asks, which rests on no premise at
          # all: COUNT THE SAME THING TWICE BY DIFFERENT MEANS, and fail only
          # on the one disagreement that cannot happen. If git names added or
          # modified files over this range while the filter returned none, the
          # filter is broken. If git names none there are none, whether the
          # commit deleted, renamed, or did nothing whatever.
          #
          # The two counts share a diff engine and that is not the weakness it
          # looks: what broke in every instance this file records was the
          # POST-PROCESSING, a grep dialect here and a `--diff-filter` there,
          # and the post-processing is exactly what differs between the sides.
          #
          # A range resolving to nothing is a different fault and is no longer
          # tested here, because "the range holds commits" is the premise that
          # made this guard wrong twice. The commit message step above still
          # fails the whole job on a range of zero commits, which is where
          # that test belongs and where it is already right.
          #
          # ^[^D] RATHER THAN ^[ACM], AND THE TWO MOVE TOGETHER. ACMRT is the
          # complement of D, so this cross-count has to be the complement too,
          # or the two sides stop counting the same quantity. Widen the filter
          # and leave this at ^[ACM] and a pure rename prints "Examined 1"
          # beside "git resolved 0". It still PASSES, because the gate fires
          # only on zero against non-zero, and that is the trap: nothing goes
          # red and the report is simply false. In a step whose entire mechanism
          # is the two printed numbers, an incoherent pair is the fault itself
          # rather than an untidy edge of it.
          #
          # The other half-applied pair does go red, and is the one to expect if
          # somebody edits one line and not the other: this widened to ^[^D]
          # with the filter left at ACM fires on any commit whose every entry is
          # a rename or a type change, which is 4 commits in this tree, in
          # transatlantic_colleague, magmascript twice, and web\website.
          #
          # WHAT CLOSING IT COST, measured by replaying this step over real
          # history with each commit's OWN .gitattributes rather than today's,
          # which `git --attr-source=<sha> check-attr` is for and which is the
          # difference between a defensible number and a flattering one. Over
          # the 4,609 commits in the 47 org repos, 47 of them carrying a rename
          # or a type change: both arms of this guard fire zero times, which is
          # what the pair they replace also did, and exactly ONE commit would
          # newly fail.
          #
          # That one is very-long-boards 556dd31, which moved
          # very-long-boards.sln into godot/ at a time when that repo had NO
          # .gitattributes at all. The eol=crlf rule that makes the same file
          # legal arrived later, in 8b7c682. So the single historical casualty
          # is a repo that has since declared what it meant, and under today's
          # attributes nothing in the org fails. Measuring with today's
          # attributes instead reports zero, and reporting that number would
          # have been the easy mistake.
          #
          # Across the whole tree including dev\jamccoy the figure is 9, the
          # other 8 all there, and that half is not an audience: no repo under
          # jamccoy has an AGENTS.md, so the last step of this workflow would
          # fail all eight of them before this step ran.
          #
          # THE FILES THIS NEWLY EXPOSES ARE LEFT AS THEY ARE, deliberately.
          # Three tracked files in the org are i/crlf with no eol=crlf
          # attribute: ware/magnolia/app.js and ware/magnolia/index.html in
          # web\website, and notes/ReadMe/ReadMe.txt in
          # transatlantic_colleague, which is a vendored upstream readme. None
          # of the three has ever been renamed, so none fails anything today,
          # and if one ever is, the error above is a TRUE statement whose fix is
          # a single `git add --renormalize`. A check doing its job is not a
          # cost to be pre-empted by commits in two other repos, one of which
          # pins line endings deliberately narrowly and says so at length in its
          # own .gitattributes.
          #
          # very-long-boards.sln is NOT a fourth. It is i/crlf and declared
          # eol=crlf, which is exactly the case the attribute test below exists
          # to let through, and it is the only file in the org using it.
          #
          # AN eol=crlf ATTRIBUTE FOR THE OTHER THREE WAS REJECTED OUTRIGHT. It
          # would declare incidental CRLF intentional and exempt those paths for
          # good, which is the opposite of what the rule is for.
          #
          # web\magma-ops-backup holds the same two magnolia files and needs
          # nothing either way. It is a DOWNSTREAM MIRROR written by the
          # website's backup-private.yml, it carries no workflows at all, and it
          # cannot fail a check it does not run. Note its latest commit fails
          # this step under ACM TOO, on those same two files as plain M entries,
          # so if it ever gains CI this change is not what breaks it. The worry
          # that whatever is decided has to hold in both repos or the backup
          # starts failing on its own sync does not survive looking twice: the
          # backup records whatever the website records, which is one direction
          # rather than a pair to keep in step.
          #
          # i/mixed IS CAUGHT TOO NOW, which is the gap the commit above named
          # and deferred. A file carrying BOTH endings is i/mixed, not i/crlf,
          # so the arm below matched it under neither filter and a
          # half-converted file passed a step whose name says nothing added
          # with CRLF. No tracked file anywhere in the tree is i/mixed today,
          # so unlike the rename hole this closes a shape with no instances
          # rather than one with a cost. Worth closing anyway: a step that
          # prints "Examined 1" and then declines to judge that one file is
          # this file's own named fault rather than an untidy edge of it.
          #
          # AND MIXED IS NEVER DELIBERATE THE WAY PURE CRLF SOMETIMES IS. A
          # .sln is legitimately CRLF and one in this org says so with an
          # attribute. Nothing is legitimately half of each. CLAUDE.md records
          # both ways it actually arrives: an io.open(newline=CRLF) write of a
          # string that already held CRLF, and ruff --fix rewriting an import
          # block separated by lone CR. Both are accidents caught
          # mid-conversion, which is why the message names the one-command fix.
          #
          # WHAT CLOSING IT COSTS: NOTHING LIVE, AND SEVEN COMMITS IN A REPLAY.
          # Measured by reading EVERY blob in all 47 org repos, reachable or
          # not, which is both cheaper than a per-commit replay and stronger:
          # a blob that was never mixed cannot be reported i/mixed at any
          # commit. 30,697 blobs read, 2 over an 8 MB cap and skipped as
          # binaries.
          #
          # Nothing is i/mixed at any repo's HEAD, so no push can newly fail.
          # That is the number that matters, because this step reads
          # `git ls-files --eol` against the CHECKED OUT commit rather than
          # per-commit blobs, so the index it judges is always the index of the
          # commit being pushed.
          #
          # Eleven blobs in history do hold both endings. Four are unreachable
          # objects in magnolia and george-boole, in no commit at all, left by
          # a force push or an aborted rebase. The other seven are all one
          # path, ware/magnolia/index.html in web\website, and seven commits
          # between 2026-09-12 and 2026-09-17 modified it while it was mixed.
          # Replayed as HEAD those seven would newly fail.
          #
          # They are not a new class of breakage, which is what makes this
          # cheap. That file is i/crlf with no attribute TODAY and is one of
          # the three this step already fails whenever a push touches it,
          # recorded above and deliberately left alone. Its history is the
          # conversion that produced that state, caught half done. The same
          # single `git add --renormalize` answers both.
          resolved="$(git diff --name-status "$base" "$head" | grep -cE '^[^D]' || true)"
          echo "git resolved $resolved added or modified file(s) over the same range."
          if [ "$n" = 0 ] && [ "$resolved" != 0 ]; then
            echo "::error::git resolved $resolved added or modified file(s) and the filter returned 0. The diff filter is broken; this check examined nothing."
            exit 1
          fi

          bad=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            line="$(git ls-files --eol -- "$f" 2>/dev/null || true)"
            [ -n "$line" ] || continue

            # PARSED BY FIELD RATHER THAN GREPPED OUT OF THE WHOLE LINE, and
            # that is a bug fix rather than tidying. `git ls-files --eol`
            # prints `i/<eol> w/<eol> attr/<attrs>`, a TAB, then THE PATH, so a
            # case on the whole line tests the filename too. `*i/crlf*` matches
            # a pure-LF file at api/crlf-notes.md, because that path contains
            # the literal text i/crlf, and the step then reports CRLF in a file
            # that has none.
            #
            # No tracked path in the org triggers it today, so it is latent
            # rather than live. What makes it this commit's problem is that
            # widening the arm widens the fault with it: `*i/mixed*` would
            # match api/mixed-eol.txt, and a `*-text*` exemption would match
            # plain-text.txt, which is the worse direction because it EXEMPTS a
            # file silently instead of failing one loudly. Three instances of
            # one mistake, two of them added by this change, so the parse is
            # the change.
            #
            # The first TAB is the separator even for a path containing one,
            # because git quotes such a path rather than emitting a raw TAB.
            meta="${line%%$'\t'*}"
            ieol="${meta%%[[:blank:]]*}"
            attrs=" ${meta#*attr/} "

            # -text IS THE ONE DECLARATION THAT LEGITIMISES EITHER SHAPE, and
            # it has to be read off attr/ because of a measurement that
            # overturns the obvious design: `-text` DOES NOT CHANGE THE i/
            # FIELD. A mixed file declared -text still reads
            # `i/mixed w/mixed attr/-text`, whether the attribute landed before
            # the add or after it, and it survives `git add --renormalize`,
            # because -text means store the bytes verbatim and the field
            # reports the bytes actually stored. The tempting version of this
            # change, where -text makes a file read i/-text and so needs no
            # handling at all, is simply wrong.
            #
            # i/-text DOES occur, from git's own BINARY HEURISTIC on content: a
            # lone-CR file reads i/-text with no attribute involved. So real
            # binaries never reach either arm regardless, and the -text
            # attribute case is specifically the file git would read as text
            # that the repo says is bytes.
            #
            # EXTENDING IT TO THE CRLF ARM IS A SECOND FIX FOLDED IN
            # DELIBERATELY. An all-CRLF file declared -text fails this step as
            # it stands: i/crlf matches and eol=crlf does not, so a repo that
            # declared its bytes verbatim is told it has unexpected CRLF, which
            # is the check being wrong. Zero instances in the org. It belongs
            # here and not in a commit of its own because this commit is what
            # would otherwise make the same declaration mean two different
            # things in adjacent arms, which is the incoherence the ACMRT and
            # ^[^D] pair above exists to warn about, one level down.
            case "$attrs" in
              *' -text '*) continue ;;
            esac

            case "$ieol" in
              i/crlf)
                # Allowed only where an attribute says so.
                case "$attrs" in
                  *' eol=crlf '*) : ;;
                  *) echo "::error file=$f::committed with CRLF and no eol=crlf attribute"; bad=1 ;;
                esac
                ;;
              i/mixed)
                # NO eol=crlf EXEMPTION HERE, AND THE ASYMMETRY IS THE POINT.
                # eol=crlf implies text, so a renormalize under it yields i/lf.
                # i/mixed beside eol=crlf is therefore ALWAYS a half-applied
                # conversion rather than a declared intent, and the fix is the
                # one command named below.
                #
                # It is reachable, by exactly one route, which is worth knowing
                # because three drafts of the fixture failed to reach it and
                # reported the case handled while testing an LF file. The blob
                # must predate the rule, and the commit under test must be a
                # BARE `git mv`: that moves the index entry verbatim and scores
                # R100, which the ACMRT filter above resolves. A modify, or a
                # `git add -A` after the mv, re-runs the clean filter and
                # normalises to i/lf.
                echo "::error file=$f::committed with MIXED line endings, which no attribute declares. Fix with: git add --renormalize -- $f"
                bad=1
                ;;
            esac
          done <<< "$files"

          [ "$bad" = 0 ] || exit 1
          echo "No unexpected CRLF in the index."

      - name: This repo has an AGENTS.md
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f AGENTS.md ]; then
            echo "::error::no AGENTS.md. It is the contract every agent here reads, and the only one that travels with a clone."
            exit 1
          fi
          lines="$(grep -c '' AGENTS.md || echo 0)"
          echo "AGENTS.md present, $lines line(s)."
          # THERE ARE NO STUBS LEFT, as of 2026-10-14. Six repos carried a
          # 267-byte AGENTS.md holding one rule; all six were written, and the
          # smallest in the org is now 1,411 bytes.
          #
          # This comment said FOUR and the real number was six, because that
          # count came from a scan of one checkout rather than from the org:
          # two of the six are not cloned in the tree it walked. Do not count
          # these from a working copy. The org is the denominator:
          #
          #   gh api repos/<owner>/<repo>/contents/AGENTS.md --jq .size
          #
          # The threshold stays. A stub is worse than useless to a model: it
          # looks like guidance and is not. It now guards against a NEW repo
          # arriving with one, rather than describing a known backlog.
          if [ "$lines" -lt 15 ]; then
            echo "::warning::AGENTS.md is $lines lines. A stub reads as guidance and is not. Say what the repo is, how to run its checks, and what must be verified rather than assumed."
          fi
